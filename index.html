<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MO Orani Mangrove Restoration System</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><div class="brand"><span>MO</span><div><strong>Orani Mangrove Restoration System</strong><small>Orani, Bataan site assessment & decision support</small></div></div><div id="saveState" class="status">Local data ready</div></header>
  <div class="shell">
    <nav id="nav" aria-label="Main navigation"></nav>
    <main>
      <section id="dashboard" class="view active"></section>
      <section id="mapping" class="view"></section>
      <section id="assessment" class="view"></section>
      <section id="satellite" class="view"></section>
      <section id="suitability" class="view"></section>
      <section id="species" class="view"></section>
      <section id="nursery" class="view"></section>
      <section id="planting" class="view"></section>
      <section id="monitoring" class="view"></section>
      <section id="report" class="view"></section>
      <section id="references" class="view"></section>
    </main>
  </div>
  <input type="file" id="geojsonFile" accept=".geojson,.json,application/geo+json" hidden>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
